name: Generate contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate matching light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0284C7&color_dots=#F0F9FF,#BAE6FD,#38BDF8,#0284C7,#075985
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0B1220,#083344,#0E7490,#06B6D4,#67E8F9

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
