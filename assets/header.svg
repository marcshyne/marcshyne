<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Marc Shyne — 4L</title>
  <desc id="desc">Animated liquid blue identity header for Marc Shyne</desc>
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"><animate attributeName="stop-color" values="#67E8F9;#0EA5E9;#67E8F9" dur="5s" repeatCount="indefinite" /></stop>
      <stop offset="0.48" stop-color="#0EA5E9"><animate attributeName="stop-color" values="#0EA5E9;#2563EB;#0EA5E9" dur="5s" repeatCount="indefinite" /></stop>
      <stop offset="1" stop-color="#1D4ED8" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity=".26" />
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#38BDF8" stroke-opacity=".07" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset=".5" stop-color="#22D3EE" stop-opacity=".2" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#050A12" />
  <rect width="1200" height="360" rx="28" fill="url(#grid)" />
  <circle cx="184" cy="178" r="270" fill="url(#halo)"><animate attributeName="r" values="245;285;245" dur="6s" repeatCount="indefinite" /></circle>
  <circle cx="1040" cy="36" r="160" fill="url(#halo)"><animate attributeName="cx" values="1010;1080;1010" dur="8s" repeatCount="indefinite" /></circle>
  <rect x="-300" width="260" height="360" fill="url(#scan)" transform="skewX(-18)"><animate attributeName="x" from="-300" to="1350" dur="6s" repeatCount="indefinite" /></rect>

  <g filter="url(#glow)">
    <text x="64" y="240" fill="url(#liquid)" font-family="Arial Black, Inter, sans-serif" font-size="220" font-weight="900" letter-spacing="-24">4L</text>
    <circle cx="119" cy="269" r="9" fill="#0EA5E9">
      <animate attributeName="cy" values="267;286;267" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="9;5;9" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <path d="M250 236c0 0 3 52 15 52s15-52 15-52z" fill="#2563EB"><animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="3.4s" repeatCount="indefinite" /></path>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="510" y="104" fill="#E6F7FF" font-size="18" letter-spacing="7">MARC SHYNE</text>
    <text x="510" y="170" fill="#FFFFFF" font-size="44" font-weight="800">SYSTEMS THAT MOVE.</text>
    <text x="512" y="210" fill="#7DD3FC" font-size="17" letter-spacing="2">AI AUTOMATION  /  TELEGRAM  /  PRODUCT UI</text>
    <g transform="translate(512 262)">
      <rect width="510" height="2" fill="#172033" />
      <rect width="180" height="2" fill="url(#liquid)"><animate attributeName="width" values="110;510;110" dur="4.5s" repeatCount="indefinite" /></rect>
      <circle cy="1" r="5" fill="#67E8F9"><animate attributeName="cx" values="110;510;110" dur="4.5s" repeatCount="indefinite" /></circle>
    </g>
    <text x="512" y="310" fill="#64748B" font-size="13" letter-spacing="3">BUILD  →  AUTOMATE  →  SHIP  →  REPEAT</text>
  </g>
  <circle cx="1152" cy="310" r="4" fill="#22D3EE"><animate attributeName="opacity" values="1;.15;1" dur="1.4s" repeatCount="indefinite" /></circle>
</svg>
