<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Contribution snake game</title>
  <desc id="desc">A blue snake eats contribution cells, grows, bites its tail, shows Game Over and restarts.</desc>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="17" height="17" rx="3" fill="#07101d" stroke="#10223b"/>
    </pattern>
    <linearGradient id="body" x1="0" x2="1">
      <stop stop-color="#075cff"/><stop offset=".55" stop-color="#00aeef"/><stop offset="1" stop-color="#7debff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="route" pathLength="1000" d="M52 56H340V96H90V136H1030V176H420V216H920C1040 216 1070 128 984 96C902 66 824 109 850 164C871 207 950 187 932 136C920 105 875 113 880 146"/>
  </defs>
  <rect width="1200" height="300" rx="22" fill="#02060d"/>
  <rect x="32" y="36" width="1136" height="204" fill="url(#grid)" opacity=".9"/>
  <g fill="#155eef" filter="url(#glow)">
    <rect x="174" y="41" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.03;.045;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="296" y="41" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.07;.085;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="228" y="81" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.137;.152;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="92" y="81" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.183;.198;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="302" y="121" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.237;.252;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="562" y="121" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.297;.312;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="882" y="121" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.367;.382;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="818" y="161" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.447;.462;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="578" y="161" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.503;.518;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="440" y="201" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.563;.578;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="672" y="201" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.613;.628;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="900" y="201" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.657;.672;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="1000" y="118" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.703;.718;.98;1" dur="15s" repeatCount="indefinite"/></rect>
    <rect x="886" y="86" width="17" height="17" rx="3"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.747;.762;.98;1" dur="15s" repeatCount="indefinite"/></rect>
  </g>
  <use href="#route" fill="none" stroke="url(#body)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" stroke-dasharray="0 1000">
    <animate attributeName="stroke-dasharray" values="0 1000;1000 0;1000 0;0 1000" keyTimes="0;.8;.98;1" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;.3;.3;1" keyTimes="0;.79;.82;.98;1" dur="15s" repeatCount="indefinite"/>
  </use>
  <g filter="url(#glow)">
    <circle r="12" fill="#baf6ff" stroke="#075cff" stroke-width="4">
      <animateMotion dur="15s" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear" rotate="auto" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.798;.815;.98;1" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(880 146)" fill="none" stroke="#7debff" stroke-width="3" opacity="0" filter="url(#glow)">
    <circle r="12"><animate attributeName="r" values="12;12;55;55;12" keyTimes="0;.8;.86;.98;1" dur="15s" repeatCount="indefinite"/></circle>
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.8;.81;.86;1" dur="15s" repeatCount="indefinite"/>
  </g>
  <g text-anchor="middle" font-family="Arial,Helvetica,sans-serif" opacity="0">
    <rect x="0" y="0" width="1200" height="240" fill="#02060d" opacity=".78"/>
    <text x="600" y="115" fill="#eaf8ff" font-size="45" font-weight="900" letter-spacing="8">GAME OVER</text>
    <text x="600" y="150" fill="#00aeef" font-size="14" font-weight="700" letter-spacing="4">SELF-BITE // FINAL SCORE 140</text>
    <text x="600" y="182" fill="#778aa5" font-size="12" letter-spacing="3">RESTARTING...</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.81;.85;.96;1" dur="15s" repeatCount="indefinite"/>
  </g>
  <text x="32" y="272" fill="#00aeef" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="3">CONTRIBUTION RUN // RESPAWN ENABLED</text>
  <text x="1168" y="272" text-anchor="end" fill="#465a76" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">4L SYSTEM</text>
</svg>
